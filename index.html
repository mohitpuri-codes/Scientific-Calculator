<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main>
      <button class="history-btn">History</button>
      <div class="history-container">
        <p>Calculation History</p>
        <ul class="history-list"></ul>
      </div>
      <div class="display">0</div>
      <div class="calulate-degree">
        <button class="highlight" id="deg" value="degree">DEG</button>
        <button class="highlight" id="function-exponent" value="F-E">
          F-E
        </button>
      </div>
      <div class="memory-clear-container">
        <button class="highlight fade-color" value="MC">MC</button>
        <button class="highlight fade-color" value="MR">MR</button>
        <button class="highlight" value="M+">M+</button>
        <button class="highlight" value="M-">M-</button>
        <button class="highlight" value="MS">MS</button>
      </div>
      <div class="advance-functions">
        <div class="dropdown">
          <button class="dropbtn" id="trigonometry-dropdown">
            <img
              aria-hidden="true"
              src="assets/trigonometry.svg"
              alt="triangle"
            />
            Trigonometry
            <img src="assets/arrow-down.svg" alt="More" aria-hidden="true" />
          </button>
          <div id="trigonometryDropdown" class="dropdown-content">
            <button value="sin">sin(x)</button>
            <button value="cos">cos(x)</button>
            <button value="tan">tan(x)</button>
          </div>
        </div>
        <div class="functions-dropdown">
          <button class="functionDropbtn" id="functional-dropdown">
            <img
              aria-hidden="true"
              src="assets/function.svg"
              alt="functions icon"
            />
            Function
            <img src="assets/arrow-down.svg" alt="More" aria-hidden="true" />
          </button>
          <div id="functionDropdown" class="function-dropdown-content">
            <button value="floor">floor(x)</button>
            <button value="ceil">ceil(x)</button>
          </div>
        </div>
      </div>
      <div class="operations keys">
        <div class="row-1">
          <button class="col" value="2nd">2<sup>nd</sup></button>
          <button class="col" value="square">x<sup>2</sup></button>
          <button class="col" value="√"><sup>2</sup>√x</button>
          <button class="col" value="power">x<sup>y</sup></button>
          <button class="col" value="10^x">10<sup>x</sup></button>
          <button class="col" value="log">log</button>
          <button class="col" value="ln">ln</button>
        </div>
        <div class="row-1">
          <button class="col" value="π">π</button>
          <button class="col" value="1/x"><sup>1</sup>/x</button>
          <button class="col" value="(">(</button>
          <button class="col highlight number" value="7">7</button>
          <button class="col highlight number" value="4">4</button>
          <button class="col highlight number" value="1">1</button>
          <button class="col highlight number" value="+/-">+/-</button>
        </div>
        <div class="row-1">
          <button class="col" value="e">e</button>
          <button class="col" value="abs">| x |</button>
          <button class="col" value=")">)</button>
          <button class="col highlight number" value="8">8</button>
          <button class="col highlight number" value="5">5</button>
          <button class="col highlight number" value="2">2</button>
          <button class="col highlight number" value="0">0</button>
        </div>
        <div class="row-1">
          <button class="col" value="C">C</button>
          <button class="col" value="exp">exp</button>
          <button class="col" value="factorial">n!</button>
          <button class="col highlight number" value="9">9</button>
          <button class="col highlight number" value="6">6</button>
          <button class="col highlight number" value="3">3</button>
          <button class="col highlight number" value=".">.</button>
        </div>
        <div class="row-1">
          <button class="col" value="backspace">
            <img src="assets/cross.svg" alt="remove an element" />
          </button>
          <button class="col" value="%">mod</button>
          <button class="col" value="/">÷</button>
          <button class="col" value="*">x</button>
          <button class="col" value="-">−</button>
          <button class="col" value="+">+</button>
          <button class="col equals" value="equals">=</button>
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="script.js"></script>
</html>
